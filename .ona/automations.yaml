tasks:
  download:
    name: Download Go modules
    command: |
      go mod download
    triggeredBy:
      - manual
      - postDevcontainerStart

  build:
    name: Build
    command: |
      go build ./...
    triggeredBy:
      - manual

  test:
    name: Test
    command: |
      go test ./...
    triggeredBy:
      - manual

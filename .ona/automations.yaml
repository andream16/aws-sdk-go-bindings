tasks:
    download-dependencies:
        name: Download Go dependencies
        command: |
            go mod download
        triggeredBy:
            - manual

    build:
        name: Build packages
        command: |
            go test -run '^$' ./...
        triggeredBy:
            - manual

    test:
        name: Run Go tests
        command: |
            go test -v -cover -race ./...
        triggeredBy:
            - manual

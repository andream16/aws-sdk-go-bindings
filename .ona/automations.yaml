tasks:
    install:
        name: Download Go dependencies
        command: |
            go mod download
        triggeredBy:
            - postDevcontainerStart
            - manual

    build:
        name: Build all Go packages
        command: |
            go test ./...
        triggeredBy:
            - manual

    test:
        name: Run Go test suite
        command: |
            go test -v -cover -race ./...
        triggeredBy:
            - manual
